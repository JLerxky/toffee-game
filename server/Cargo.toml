[package]
name = "server"
version = "0.1.0"
authors = ["JLer <472102489@qq.com>"]
edition = "2018"

[dependencies]
config = { path = "../config" }
protocol = { path = "../protocol" }

serde = { version = "1.0.126", features = ["derive"] }
bincode = "1.3.3"
base64 = "0.13.0"
rapier3d = { version = "0.10.1", features = [ "simd-stable" ] }
crossbeam = "0.8.1"
rand = "0.8.4"
rustyline = "8.2.0"
sha2 = "0.9.5"
tokio = { version = "1.8.1", features = ["full"] }
tokio-util = { version = "0.6.7", features = ["full"] }
tokio-stream = "0.1.7"
bytes = "1.0.1"
futures = { version = "0.3.15", features = ["thread-pool"] }
glam = "0.17.1"
